# Training run configuration for FireLam 1.5
output_dir: "outputs/firelam-1.5-lora"
dataset_path: "data/sample_dataset.jsonl"   # point this at your real dataset
eval_dataset_path: null                      # optional held-out split, same format

num_train_epochs: 3
per_device_train_batch_size: 2
gradient_accumulation_steps: 8               # effective batch size = 16
learning_rate: 2.0e-4
lr_scheduler_type: "cosine"
warmup_ratio: 0.03
weight_decay: 0.01
max_grad_norm: 0.3

logging_steps: 10
save_strategy: "steps"
save_steps: 200
save_total_limit: 3
eval_strategy: "steps"
eval_steps: 200

optim: "paged_adamw_8bit"
bf16: true
gradient_checkpointing: true
seed: 42

report_to: "wandb"          # set to "none" if you don't want W&B logging
run_name: "firelam-1.5-beta"
