<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FireLam Chat</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #0f1115; color: #e6e6e6; margin: 0; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 20px; font-weight: 600; }
  #key-bar { display: flex; gap: 8px; margin-bottom: 16px; }
  #key-bar input { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #333; background: #1a1d23; color: #e6e6e6; }
  #messages { display: flex; flex-direction: column; gap: 10px; min-height: 320px; margin-bottom: 16px; }
  .msg { padding: 10px 14px; border-radius: 10px; max-width: 85%; white-space: pre-wrap; line-height: 1.4; }
  .user { align-self: flex-end; background: #2b5cff; color: white; }
  .assistant { align-self: flex-start; background: #1a1d23; border: 1px solid #2a2d34; }
  .system { align-self: center; color: #888; font-size: 13px; }
  #input-bar { display: flex; gap: 8px; }
  #input-bar textarea { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #1a1d23; color: #e6e6e6; resize: vertical; min-height: 44px; }
  button { padding: 10px 16px; border-radius: 8px; border: none; background: #2b5cff; color: white; cursor: pointer; font-weight: 600; }
  button:disabled { opacity: 0.5; cursor: default; }
  .model-tag { color: #777; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>FireLam Chat <span class="model-tag">({{ model_name }})</span></h1>

  <div id="key-bar">
    <input id="api-key" type="password" placeholder="Enter your API key">
    <button id="save-key">Save</button>
  </div>

  <div id="messages"></div>

  <div id="input-bar">
    <textarea id="input" placeholder="Ask FireLam anything..." rows="2"></textarea>
    <button id="send">Send</button>
  </div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const apiKeyEl = document.getElementById('api-key');
const saveKeyBtn = document.getElementById('save-key');

let history = [];

apiKeyEl.value = localStorage.getItem('firelam_api_key') || '';

saveKeyBtn.onclick = () => {
  localStorage.setItem('firelam_api_key', apiKeyEl.value.trim());
  addSystemMsg('API key saved locally in this browser.');
};

function addMsg(role, content) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = content;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addSystemMsg(text) {
  const div = document.createElement('div');
  div.className = 'msg system';
  div.textContent = text;
  messagesEl.appendChild(div);
}

async function send() {
  const text = inputEl.value.trim();
  const apiKey = apiKeyEl.value.trim();
  if (!text) return;
  if (!apiKey) { addSystemMsg('Enter your API key above first.'); return; }

  addMsg('user', text);
  history.push({ role: 'user', content: text });
  inputEl.value = '';
  sendBtn.disabled = true;

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-API-Key': apiKey },
      body: JSON.stringify({ messages: history }),
    });
    const data = await resp.json();
    if (!resp.ok) {
      addSystemMsg('Error: ' + (data.detail || resp.statusText));
    } else {
      addMsg('assistant', data.reply);
      history.push({ role: 'assistant', content: data.reply });
    }
  } catch (e) {
    addSystemMsg('Network error: ' + e.message);
  } finally {
    sendBtn.disabled = false;
  }
}

sendBtn.onclick = send;
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
</script>
</body>
</html>
